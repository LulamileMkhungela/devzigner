<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ProdOps">
  <title>ProdOps</title>
  <!-- ProdOps favicon: the accent square and the earned check. Geometry is
       identical to prodops-mark.svg so the tab, the app icon and the README
       all show the same product. -->
  <defs>
    <linearGradient id="fav-accent" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a3d" />
      <stop offset="1" stop-color="#d83c0b" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#fav-accent)" />
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.5" />
  <path d="M17 33.5 L27.5 44 L47.5 20.5" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
